<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>San Francisco AirBNB Listings</title>

    <!--bootstrap CSS-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <!--my own CSS-->
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="container">
      <!--header section-->
      <!--pt-5 and pb-4 give padding to the top and bottom. mb-4 gives margin to the bottom before listings. border-bottom adds a bottom border.-->
      <header class="pt-5 pb-4 mb-4 border-bottom">
      <h1>San Francisco Rentals</h1>
      <!--lead gives slightly larger text-->
      <p class="lead">
        Explore 50 Airbnb listings around the city. Sort them by price to find the best deal.
      </p>
      </header>

      <section>
        <!--flex container for the heading and sort button. pushes them to opposite ends.-->
        <div class="d-flex justify-content-between align-items-center">
        <h2>Listings</h2>
        <button id="sortPrice" class="btn btn-primary mb-3">Sort by price: low to high</button>
        </div>
        <!--listings section. this is what JS will fill with the 50 listing cards-->
        <!--"row" is bootstrap's grid system. g-4 adds equal vertical and horizontal space between cards.-->
        <div id="listings" class="row g-4"></div>
      </section>
    </div>
    <!--bootstrap JS-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <!--my own JS-->
    <script src="js/main.js"></script>
  </body>
</html>
